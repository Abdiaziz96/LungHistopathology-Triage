<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lung Triage — AI-Assisted Histopathology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;
  --surface:#fbfaf6;
  --ink:#1a1a1a;
  --sub:#8a8780;
  --border:#e6e2d8;
  --dash:#c9c4b6;
  --soft:#efece4;
  --green:#2a5d27;
  --green-bg:#e8f0e6;
  --warn-bg:#fbf2e3;
  --warn-ink:#7a5a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  font-size:14.5px;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.h-left{display:flex;align-items:center;gap:12px}
.brand-block{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{
  width:28px;height:28px;background:var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
  font-family:'Instrument Serif',serif;
}
.brand-text{line-height:1.15}
.brand-text .top{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);font-weight:600}
.brand-text .bot{font-size:14px;font-weight:600;letter-spacing:.005em;color:var(--ink);margin-top:1px}
.h-status{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--green-bg);color:var(--green);
  font-size:11.5px;font-weight:600;
  padding:5px 11px;border-radius:999px;margin-left:10px;
  border:1px solid rgba(42,93,39,.12);
}
.h-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.h-right{display:flex;align-items:center;gap:22px}
.h-link{
  font-size:13.5px;color:var(--ink);text-decoration:none;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;opacity:.8;
}
.h-link:hover{opacity:1}
.h-link svg{width:14px;height:14px}
.h-user{
  display:flex;align-items:center;gap:9px;cursor:pointer;position:relative;
  font-size:13.5px;font-weight:500;
}
.h-user .avatar{
  width:30px;height:30px;border-radius:50%;
  background:#1a1a1a;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.h-user .chev{width:13px;height:13px;opacity:.45;transition:transform .15s}
.h-user.open .chev{transform:rotate(180deg)}
.h-user-menu{
  position:absolute;top:calc(100% + 10px);right:0;
  background:#fff;border:1px solid var(--border);
  border-radius:10px;min-width:170px;
  box-shadow:0 12px 30px rgba(20,20,20,.08),0 2px 6px rgba(0,0,0,.04);
  padding:6px 0;display:none;z-index:20;
}
.h-user.open .h-user-menu{display:block}
.h-user-menu a{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;font-size:13.5px;color:var(--ink);
  text-decoration:none;font-weight:500;
}
.h-user-menu a:hover{background:var(--soft)}
.h-user-menu a.active{background:var(--soft);font-weight:600}
.h-user-menu a .check{opacity:0;color:var(--ink)}
.h-user-menu a.active .check{opacity:1}
main{
  flex:1;width:100%;
  max-width:960px;margin:0 auto;
  padding:56px 28px 56px;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sub);font-weight:600;margin-bottom:14px;
}
.hero-eyebrow svg{width:11px;height:11px}
.hero h1{
  font-family:'Instrument Serif',Georgia,'Times New Roman',serif;
  font-size:clamp(2rem,4.5vw,2.65rem);
  line-height:1.08;font-weight:400;
  letter-spacing:-.015em;margin-bottom:10px;color:var(--ink);
}
.hero h1 em{font-style:italic;font-family:'Instrument Serif',serif}
.hero-sub{font-size:15.5px;color:var(--sub);max-width:540px;margin-bottom:20px}
.hero-actions{display:flex;align-items:center;gap:10px;margin-bottom:38px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--ink);
  background:#fff;color:var(--ink);
  border-radius:999px;
  padding:9px 17px;
  font-size:12.5px;font-weight:600;
  cursor:pointer;font-family:inherit;
  text-decoration:none;line-height:1;
  transition:.15s;
}
.btn:hover{background:var(--ink);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000;color:#fff}
.btn svg{width:13px;height:13px}
.upload-zone{
  border:1.5px dashed var(--dash);
  border-radius:14px;background:var(--surface);
  padding:62px 28px;text-align:center;
  position:relative;transition:border-color .2s, background .2s;cursor:pointer;
}
.upload-zone:hover{border-color:#9a9586;background:#fff}
.upload-icon{
  width:50px;height:50px;border:1.25px solid var(--ink);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;background:transparent;
}
.upload-icon svg{width:20px;height:20px;color:var(--ink)}
.upload-zone h3{font-size:17px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.upload-zone .or{font-size:14px;color:var(--sub);margin-bottom:10px}
.upload-zone .browse{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-weight:500;cursor:pointer}
.upload-zone .formats{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:12.5px;color:#a09a8c;font-weight:500;margin-top:8px;
}
.upload-zone .formats .ext{
  font-family:'JetBrains Mono','SF Mono',monospace;
  font-size:11.5px;background:var(--soft);
  padding:3px 8px;border-radius:6px;color:#5e5b52;border:1px solid var(--border);
}
.upload-zone .formats .upto{color:#a09a8c;margin-left:4px}
#file-input{display:none}
.result{display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px 28px}
.result.show{display:block}
.result h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:18px}
.result .verdict{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:18px}
.result .verdict .cls{font-family:'Instrument Serif',serif;font-size:30px;font-weight:400;line-height:1.1;color:var(--ink)}
.result .verdict .cls em{font-style:italic}
.result .verdict .conf{text-align:right}
.result .verdict .conf .num{font-family:'Instrument Serif',serif;font-size:34px;line-height:1}
.result .verdict .conf .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prob{background:var(--soft);border-radius:10px;padding:14px}
.prob .name{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:8px}
.prob .bar{height:6px;background:#e6e2d8;border-radius:3px;overflow:hidden;margin-bottom:8px}
.prob .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.prob .val{font-size:18px;font-weight:600;font-family:'Instrument Serif',serif}
.below{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-top:48px;padding-top:40px;
  border-top:1px solid var(--border);text-align:center;
}
.below .icon{width:42px;height:42px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.below .icon svg{width:20px;height:20px;color:var(--ink)}
.below p{font-size:13.5px;color:var(--sub);font-weight:500}
.below .hint{font-size:11.5px;color:#b1a99b;margin-top:2px}
.footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--sub);background:var(--bg);font-weight:500;
}
.footer .legal{color:var(--ink);font-weight:500}
.footer .warn{display:inline-flex;align-items:center;gap:8px}
.footer .warn .i{width:16px;height:16px;border-radius:50%;background:var(--warn-bg);color:var(--warn-ink);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:500;
  opacity:0;transition:.25s;pointer-events:none;z-index:50;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header class="header">
  <div class="h-left">
    <a class="brand-block" href="#">
      <span class="brand-mark">L</span>
      <span class="brand-text">
        <span class="top">Digital Pathology</span>
        <span class="bot">Lung Triage</span>
      </span>
    </a>
    <span class="h-status"><span class="dot"></span>Model Live</span>
  </div>
  <div class="h-right">
    <a href="#" class="h-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      NHS Trust
    </a>
    <a href="#" class="h-link" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </a>
    <div class="h-user" id="userMenu">
      <span class="avatar">SJ</span>
      <span id="userLabel">Pathologist</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="h-user-menu">
        <a href="#" data-role="Clinician">Clinician <span class="check">✓</span></a>
        <a href="#" data-role="Pathologist" class="active">Pathologist <span class="check">✓</span></a>
        <a href="#" data-role="Admin">Admin <span class="check">✓</span></a>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-eyebrow">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.5H19l-4.5 3.3 1.7 5.5L12 13l-4.2 3.3 1.7-5.5L5 7.5h5.2z"/></svg>
      AI-Assisted Triage
    </div>
    <h1>Precision Lung Cancer<br><em>Screening</em></h1>
    <p class="hero-sub">Upload a whole-slide image for AI-assisted classification with Grad-CAM visualisation.</p>
    <div class="hero-actions">
      <a href="#" class="btn btn-dark" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Export Report
      </a>
      <a href="#" class="btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
        Share
      </a>
    </div>
  </section>

  <section id="upload">
    <div class="upload-zone" id="zone" role="button" tabindex="0" aria-label="Upload whole-slide image">
      <label for="file-input" style="cursor:pointer;display:block">
        <div class="upload-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <h3>Drop a whole-slide image</h3>
        <p class="or">or <span class="browse">browse files</span></p>
        <div class="formats">
          <span class="ext">.svs</span>
          <span class="ext">.tiff</span>
          <span class="ext">.png</span>
          <span class="ext">.jpg</span>
          <span class
